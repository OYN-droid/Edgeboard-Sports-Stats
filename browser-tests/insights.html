<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>EdgeBoard deterministic insights browser tests</title>
  <link rel="icon" href="data:," />
  <body>
    <h1>EdgeBoard deterministic insights browser tests</h1>
    <pre id="results">Running…</pre>
    <script>
      window.testErrors = [];
      window.addEventListener("error", (event) => window.testErrors.push(`${event.message} (${event.filename || "unknown"}:${event.lineno || 0})`));
      window.addEventListener("unhandledrejection", (event) => window.testErrors.push(String(event.reason)));
      window.setTimeout(() => {
        if (document.querySelector("#results")?.textContent === "Running…") {
          document.querySelector("#results").textContent = `ERROR\n${window.testErrors.join("\n") || "Harness did not complete."}`;
        }
      }, 15000);
    </script>
    <iframe id="app" src="/?mode=stats&amp;scope=league:wnba&amp;testFixtureTimestamp=2099-01-01T00%3A00%3A00.000Z" title="EdgeBoard Phase 4 app under test" style="width:390px;height:860px;border:0"></iframe>
    <script type="module" src="./insights.js"></script>
  </body>
</html>
