<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>EdgeBoard statistical research browser tests</title>
  <link rel="icon" href="data:," />
  <body>
    <h1>EdgeBoard statistical research browser tests</h1>
    <pre id="results">Running…</pre>
    <script>
      window.testErrors = [];
      window.addEventListener("error", (event) => {
        window.testErrors.push(
          `${event.message} (${event.filename || "unknown"}:${event.lineno || 0}:${event.colno || 0})`,
        );
      });
      window.addEventListener("unhandledrejection", (event) => window.testErrors.push(String(event.reason)));
      window.setTimeout(() => {
        if (document.querySelector("#results")?.textContent === "Running…") {
          document.querySelector("#results").textContent = `ERROR\n${window.testErrors.join("\n") || "Harness did not complete."}`;
        }
      }, 20000);
    </script>
    <iframe
      id="app"
      src="/?mode=stats&amp;scope=league:wnba"
      title="EdgeBoard statistical research app under test"
      style="width:390px;height:800px;border:0"
    ></iframe>
    <script type="module" src="./stats-research.js"></script>
  </body>
</html>
